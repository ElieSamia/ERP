<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel ERP prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F0;--surface:#FFFFFF;--sunk:#F5F8F7;--ink:#15212B;--muted:#56666F;--line:#D3DCDB;
  --accent:#0E6B6B;--accent-ink:#FFFFFF;--accent-soft:#D9ECEA;
  --bar:#103A3D;--bar-ink:#E6F1F0;--bar-muted:#9CC0BD;
  --amber:#8F5C0E;--amber-soft:#F5E8CF;--red:#A63434;--red-soft:#F6DFDF;--green:#2B6E43;--green-soft:#DCEEE2;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161C;--surface:#16212A;--sunk:#1B2832;--ink:#E4ECEF;--muted:#93A5AF;--line:#2B3B46;
    --accent:#4FB5AE;--accent-ink:#06201F;--accent-soft:#163837;
    --bar:#0A2023;--bar-ink:#E0EEEC;--bar-muted:#7FA9A5;
    --amber:#E3AB55;--amber-soft:#3A2D16;--red:#E58585;--red-soft:#3D2023;--green:#74C690;--green-soft:#1A3424;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161C;--surface:#16212A;--sunk:#1B2832;--ink:#E4ECEF;--muted:#93A5AF;--line:#2B3B46;
  --accent:#4FB5AE;--accent-ink:#06201F;--accent-soft:#163837;
  --bar:#0A2023;--bar-ink:#E0EEEC;--bar-muted:#7FA9A5;
  --amber:#E3AB55;--amber-soft:#3A2D16;--red:#E58585;--red-soft:#3D2023;--green:#74C690;--green-soft:#1A3424;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font,"Instrument Sans"),"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{margin:0;line-height:1.25}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;background:var(--bar);color:var(--bar-ink)}
.appsbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:var(--bar-ink);cursor:pointer}
.appsbtn:hover{background:rgba(255,255,255,.08)}
.brand{font-weight:600;font-size:16px;white-space:nowrap}
.modnav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.modnav button{border:0;background:transparent;color:var(--bar-muted);padding:7px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;font-weight:500}
.modnav button:hover{color:var(--bar-ink)}
.modnav button.on{color:var(--bar-ink);background:rgba(255,255,255,.1)}
.spacer{flex:1}
.role select{background:rgba(255,255,255,.08);color:var(--bar-ink);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:6px 8px;max-width:230px}
.role option{color:#15212B;background:#fff}

.main{max-width:1280px;margin:0 auto;padding:20px 18px 60px}

/* Control panel */
.cp{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:600;min-width:0}
.crumbs .sep{color:var(--muted);font-weight:400}
.crumb{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:inherit}
.cp-actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.cp-tools{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
input[type=search]{min-width:240px;flex:0 1 340px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--red)}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.icon-btn{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.icon-btn:hover{color:var(--red);background:var(--red-soft)}

/* Lists */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover{background:var(--sunk)}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.b-accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.b-green{background:var(--green-soft);color:var(--green);border-color:transparent}
.b-amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.b-red{background:var(--red-soft);color:var(--red);border-color:transparent}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:36px;text-align:center;color:var(--muted)}

/* Record page */
.recpage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.recmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.sheet h2{font-size:15px;font-weight:600;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:13px;color:var(--muted);font-weight:500}
.fld.wide{grid-column:1/-1}
.fld input,.fld select,.fld textarea,.lines input,.lines select,.payform input,.payform select{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.fld textarea{resize:vertical}
.ro{padding:7px 0;white-space:pre-line}
.statusbar{display:flex;list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow-x:auto;max-width:100%}
.statusbar li{padding:6px 14px;font-size:13px;color:var(--muted);white-space:nowrap}
.statusbar li+li{border-left:1px solid var(--line)}
.statusbar li.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.statusbar li.on.cancel{background:var(--red);color:#fff}
.smart{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.smart button,.smart div{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 12px;text-align:left;cursor:pointer;color:var(--ink)}
.smart div{cursor:default}
.smart b{display:block;font-size:16px}
.smart span{font-size:12.5px;color:var(--muted)}
.linked{margin:0;display:flex;align-items:center;gap:8px;color:var(--muted)}

/* Ticket header: the one bold element */
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 260px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.route{display:flex;align-items:center;gap:18px;padding:24px 28px;min-width:0}
.pt{min-width:0}
.code{display:block;font-size:clamp(34px,5.5vw,54px);font-weight:600;letter-spacing:.02em;line-height:1}
.pt .sub{display:block;color:var(--muted);font-size:13.5px;margin-top:8px}
.path{flex:1;display:flex;align-items:center;gap:8px;color:var(--accent);min-width:50px}
.path::before,.path::after{content:"";flex:1;border-top:2px dotted var(--line)}
.stub{position:relative;border-left:2px dashed var(--line);padding:18px 22px;background:var(--sunk);display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.stub::before,.stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub::before{top:-11px}.stub::after{bottom:-11px}
.stub dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13.5px}
.stub dt{color:var(--muted)}
.stub dd{margin:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stub .tt{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.stub .tt b{font-size:20px}

/* Lines and totals */
.lines{margin:0 -4px}
.lines td,.lines th{padding:8px 6px}
.lines .w-desc{min-width:200px}
.lines .w-num{width:110px;text-align:right}
.lines .w-pct{width:80px;text-align:right}
.lines select{min-width:110px}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.addrow select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
.totals{margin:16px 0 0 auto;max-width:300px;display:flex;flex-direction:column;gap:4px}
.totals div{display:flex;justify-content:space-between;gap:20px}
.totals span{color:var(--muted)}
.totals .grand{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-size:17px}
.totals .grand span{color:var(--ink);font-weight:600}
.payform{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.payform .fld{flex:1 1 140px}
.paylist{list-style:none;margin:0;padding:0}
.paylist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.paylist li:last-child{border-bottom:0}

/* Chatter */
.chatter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
.chatter h3{font-size:15px;margin-bottom:10px}
.note{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.note textarea{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;width:100%}
.note .btn{align-self:flex-end}
.log{list-style:none;margin:0;padding:0;max-height:480px;overflow:auto}
.log li{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.log .who{font-weight:600;font-size:13px}
.log time{color:var(--muted);font-weight:400;margin-left:6px}
.log p{margin:2px 0 0}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{border-radius:12px;padding:8px;min-height:200px;background:color-mix(in srgb,var(--surface) 45%,transparent);border:1px solid var(--line)}
.kcol.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.khead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 10px}
.khead h3{font-size:14px}
.khead span{font-size:12.5px;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.kcard:hover{border-color:var(--accent)}
.kcard h4{margin:0 0 4px;font-size:14.5px;font-weight:600}
.kcard p{margin:0;font-size:13px;color:var(--muted)}
.kcard .kf{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;font-weight:600}

/* Home */
.home h1{font-size:26px;margin-bottom:4px}
.home>p{color:var(--muted);margin:0 0 22px;max-width:62ch}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:960px}
.app{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.app:hover{border-color:var(--accent)}
.app .ico{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.app b{font-size:16px}
.app span{font-size:13.5px;color:var(--muted)}
.homefoot{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:14px}

/* Banner, reports */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.meter{flex:1 1 200px;height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.over{background:var(--red)}
.pricing{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px}
.pricing .fld{width:150px}
.hint{color:var(--muted);font-size:13.5px;margin:10px 0 0;max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{color:var(--muted);font-size:13.5px}
.kpi b{display:block;font-size:22px;margin-top:2px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bar{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.fill{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Accounting */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);width:100%;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px;color:var(--muted);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
tr.grp td{background:var(--sunk);font-weight:600;font-size:13.5px;color:var(--muted)}
tfoot td{border-top:1px solid var(--line);border-bottom:0}
.stmt{width:100%}.stmt td,.stmt th{padding:7px 4px}
.stmt tbody tr[data-act]{cursor:pointer}.stmt tbody tr[data-act]:hover{background:var(--sunk)}
.stmt tfoot td{font-weight:600}
.result{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-top:16px}.result b{font-size:22px}
.newacct{display:grid;grid-template-columns:130px minmax(0,1fr) 170px auto;gap:12px;align-items:end}
.lines .w-acc{min-width:230px}
@media (max-width:640px){.newacct{grid-template-columns:1fr}}
/* Calendar */
.k-flight{--k:var(--accent);--kb:var(--accent-soft)}.k-service{--k:#5B7DB1;--kb:var(--sunk)}.k-due{--k:var(--amber);--kb:var(--amber-soft)}
.k-camp{--k:var(--green);--kb:var(--green-soft)}.k-task{--k:var(--ink);--kb:var(--surface)}.k-done{--k:var(--line);--kb:var(--sunk)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;background:var(--k)}
.calnav{display:flex;align-items:center;gap:6px;margin-bottom:12px}.calnav h2{font-size:18px;margin-left:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.cal-dow{background:var(--sunk);padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.cal-day{background:var(--surface);min-height:108px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-day.out{background:var(--sunk)}.cal-day.out .cal-num{color:var(--muted)}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-num{align-self:flex-start;border:0;background:none;font-weight:600;font-size:13px;min-width:26px;height:26px;border-radius:50%;cursor:pointer;color:var(--ink)}
.cal-day.today .cal-num{background:var(--accent);color:var(--accent-ink)}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--k);background:var(--kb);color:var(--ink);border-radius:4px;padding:2px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.k-task{box-shadow:inset 0 0 0 1px var(--line)}.ev.k-done{color:var(--muted);text-decoration:line-through}
.ev span{color:var(--muted)}
.cal-more{border:0;background:none;color:var(--accent);font-size:12px;text-align:left;cursor:pointer;padding:0 6px}
.agenda{list-style:none;margin:0;padding:0}
.ag{display:grid;grid-template-columns:10px 64px minmax(0,1fr);gap:10px;align-items:baseline;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 4px;cursor:pointer;color:var(--ink)}
.ag:hover{background:var(--sunk)}.ag-time{color:var(--muted);font-size:13.5px}.ag-sub{display:block;font-size:13px}
.strike{text-decoration:line-through;color:var(--muted)}
.agdate{font-size:14px;margin:14px 0 4px}
@media (max-width:640px){.cal-day{min-height:62px;padding:3px}.ev{font-size:0;height:5px;padding:0;border:0;background:var(--k)}.ev span{display:none}.cal-more{font-size:11px;padding:0}}
/* Marketing */
.pv-mail{border:1px solid var(--line);border-radius:10px;overflow:hidden;max-width:620px}
.pv-h{background:var(--sunk);padding:10px 14px;font-size:13.5px;display:grid;gap:2px;border-bottom:1px solid var(--line)}
.pv-body{padding:14px;white-space:pre-line}
.pv-foot{padding:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.pv-sms{max-width:340px}.pv-sender{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.bubble{background:var(--sunk);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;white-space:pre-line}
.pv-post{border:1px solid var(--line);border-radius:12px;max-width:420px;overflow:hidden}
.pv-acct{display:flex;align-items:center;gap:8px;padding:10px 12px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.pv-img{aspect-ratio:4/3;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center}
.recips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* Settings */
.settings{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}
.setnav{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
.setnav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}

/* Business logic */
const channelOf=cid=>CHANNEL[find('contact',cid)?.type]||'B2C';
const sell=l=>r2(l.cost*(1+(+l.markup||0)/100));
function bTotals(b){const cost=r2(b.lines.reduce((s,l)=>s+(+l.cost||0),0));const total=r2(b.lines.reduce((s,l)=>s+sell(l),0));return{cost,total,margin:r2(total-cost)}}
const iUntaxed=i=>r2(i.lines.reduce((s,l)=>s+(+l.amount||0),0));
const iVat=i=>r2(i.lines.reduce((s,l)=>s+r2((+l.amount||0)*(+l.vat||0)/100),0));
const iTotal=i=>r2(iUntaxed(i)+iVat(i));
const iPaid=i=>r2(i.payments.reduce((s,p)=>s+(+p.amount||0),0));
const iBalance=i=>r2(iTotal(i)-iPaid(i));
function applyChannelMarkup(b){const rate=DB.pricing[channelOf(b.contactId)];b.lines.forEach(l=>l.markup=rate)}
function exposure(cid,excludeId){
  const inv=DB.invoice.filter(i=>i.contactId===cid).reduce((s,i)=>s+iBalance(i),0);
  const open=DB.booking.filter(b=>b.contactId===cid&&b.id!==excludeId&&['confirmed','ticketed'].includes(b.status)).reduce((s,b)=>s+bTotals(b).total,0);
  return r2(inv+open);
}
/* Record rules: B2B agents only see their own agency's records */
const visibleBookings=()=>{if(!isAgent())return DB.booking;const p=P();const mine=DB.booking.filter(b=>b.contactId===S.role);if(!p.bookings||p.bookings==='none')return [];
  if(p.bookings==='travelling'){const n=((puser()||{}).name||'').toLowerCase();return mine.filter(b=>travList(b).some(t=>t.toLowerCase()===n))}
  if(p.scope==='own')return mine.filter(b=>DB.request.some(r=>r.bookingId===b.id&&r.createdById===S.puser));return mine};
const visibleInvoices=()=>isAgent()?(P().invoices==='yes'?DB.invoice.filter(i=>i.contactId===S.role):[]):DB.invoice;
function canSee(m,r){if(!isAgent())return true;if(m==='purchase')return r.supplierId===S.role&&r.status!=='draft'&&P().orders!=='none';if(m==='booking')return visibleBookings().includes(r);if(m==='invoice')return r.contactId===S.role&&r.status!=='draft'&&P().invoices==='yes';if(m==='request')return r.agencyId===S.role&&((S.draft&&S.draft.rec===r)||agencyReqs().includes(r));return false}
const allowedModules=()=>isAgent()?MODULES.filter(m=>(m.agentOnly===(isSup()?'supplier':'customer')||m.agentOnly==='both')&&(!m.can||m.can(P()))):MODULES.filter(m=>!m.agentOnly);

/* ---------- Generic field renderer ---------- */
function field(model,rec,name,ro=false){
  const f=MODELS[model].fields[name];if(f.showIf&&!f.showIf(rec))return '';
  const v=rec[name]??'';const cls=`fld ${f.wide?'wide':''}`;const fid=`f-${name}`;
  if(ro){let shown=v;
    if(f.type==='check')shown=v==='yes'?'Yes':'No';
    if(f.type==='select')shown=label(optsOf(f),v);
    else if(f.type==='m2o')shown=v?recName(f.ref,v):'Not set';
    else if(f.type==='money')shown=money(v);
    else if(f.type==='date')shown=fmtDate(v);
    return `<div class="${cls}"><span>${f.label}</span><div class="ro">${esc(shown)||'<span class="muted">Empty</span>'}</div></div>`}
  if(f.type==='m2o'&&f.combo)return comboField(model,rec,name,f);
  const a=`id="${fid}" data-model="${model}" data-id="${rec.id}" data-field="${name}"`;
  let input;
  switch(f.type){
    case 'select':input=`<select ${a} data-rerender>${opts(optsOf(f),v)}</select>`;break;
    case 'm2o':{const list=DB[f.ref].filter(f.domain||(()=>true)).map(o=>[o.id,o.name||o.ref||o.title]);input=`<select ${a} data-rerender><option value="">Choose…</option>${opts(list,v)}</select>`;break}
    case 'text':input=`<textarea ${a} rows="${f.rows||3}">${esc(v)}</textarea>`;break;
    case 'money':case 'number':input=`<input type="number" min="0" step="${f.type==='money'?'0.01':'1'}" ${a} value="${esc(v)}">`;break;
    case 'check':input=`<span class="chk"><input type="checkbox" ${a} ${v==='yes'?'checked':''} data-rerender>${esc(f.checkLabel||'')}</span>`;break;
    case 'date':input=`<input type="date" ${a} value="${esc(v)}">`;break;
    case 'time':input=`<input type="time" ${a} value="${esc(v)}">`;break;
    default:input=`<input type="text" ${a} value="${esc(v)}" ${f.upper?'maxlength="3" style="text-transform:uppercase"':''}>`;
  }
  return `<label class="${cls}" for="${fid}"><span>${f.label}</span>${input}</label>`;
}

/* ---------- Shared view pieces ---------- */
const cp=(crumbs,actions='',tools='')=>`<div class="cp"><div class="crumbs">${crumbs}</div><div class="cp-actions">${actions}</div>${tools?`<div class="cp-tools">${tools}</div>`:''}</div>`;
const crumbs=(mod,title)=>title===undefined?`<h1 style="font-size:inherit">${esc(mod)}</h1>`:`<button class="crumb" data-act="back">${esc(mod)}</button><span class="sep">/</span><span>${esc(title)}</span>`;
const searchBox=ph=>`<input type="search" id="search" placeholder="${ph}" value="${esc(S.search)}" aria-label="${ph}">`;
const chips=list=>`<div class="chips" role="group" aria-label="Filter">${list.map(([k,l])=>`<button class="chip ${S.filter===k?'on':''}" data-act="filter" data-v="${k}">${esc(l)}</button>`).join('')}</div>`;
const statusbar=(states,cur)=>`<ol class="statusbar" aria-label="Status">${states.filter(([k])=>!['cancelled','declined'].includes(k)||cur===k).map(([k,l])=>`<li class="${k===cur?'on':''} ${['cancelled','declined'].includes(k)?'cancel':''}" ${k===cur?'aria-current="step"':''}>${l}</li>`).join('')}</ol>`;
function table(rows,cols,empty){
  if(!rows.length)return `<div class="empty">${empty||'Nothing here yet.'}</div>`;
  return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${c.label}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr data-act="open" data-id="${r.id}" tabindex="0">${cols.map(c=>`<td class="${c.num?'num':''}">${c.r(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const emptySearch=what=>S.search||S.filter!=='all'?`No ${what} match this search or filter.`:`No ${what} yet. Use the New button to add one.`;
function chatter(rec,model){
  const entries=[...(rec.log||[])].reverse();
  return `<aside class="chatter" aria-label="Activity"><h3>Activity</h3>
  <div class="note"><label class="sr" for="note">Internal note</label><textarea id="note" rows="2" placeholder="Write an internal note"></textarea>${btn('Log note','note','','data-model="'+model+'"')}</div>
  <ol class="log">${entries.length?entries.map(e=>`<li><div class="who">${esc(e.by)}<time>${fmtDT(e.at)}</time></div><p>${esc(e.text)}</p></li>`).join(''):'<li class="muted">No activity yet. Status changes and notes appear here.</li>'}</ol></aside>`;
}

function contactForm(c){
  const bk=DB.booking.filter(b=>b.contactId===c.id),inv=DB.invoice.filter(i=>i.contactId===c.id);

function linesBlock(b,ed,agent){
  const sup=DB.contact.filter(c=>c.type==='supplier').map(c=>[c.id,c.name]);
  const rows=b.lines.map(l=>{

const ACC_TYPES=[['asset','Asset'],['receivable','Receivable'],['bank','Bank'],['cash','Cash'],['liability','Liability'],['payable','Payable'],['tax','Tax'],['equity','Equity'],['income','Income'],['expense','Expense']];
const FY='2026';
const PERIODS=[['y','Year '+FY],['q1','Q1 '+FY],['q2','Q2 '+FY],['q3','Q3 '+FY],['q4','Q4 '+FY]];
function periodRange(){const q={y:['01-01','12-31'],q1:['01-01','03-31'],q2:['04-01','06-30'],q3:['07-01','09-30'],q4:['10-01','12-31']}[S.period];return [FY+'-'+q[0],FY+'-'+q[1]]}
const acct=code=>DB.account.find(a=>a.code===code);
const acctName=code=>{const a=acct(code);return a?`${a.code} ${a.name}`:code};
const fmtLBP=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const am=n=>S.ccy==='LBP'?fmtLBP.format(Math.round((+n||0)*rateOf('LBP')))+' LBP':money(n);
const posted=()=>DB.move.filter(m=>m.status==='posted');
const mTotal=m=>r2(m.lines.reduce((s,l)=>s+(+l.debit||0),0));
const diffText=(d,c)=>Math.abs(d-c)<0.005?'Balanced.':`Out of balance by ${money(Math.abs(d-c))}.`;
function balances(cumulative){const [a,b]=periodRange();const res={};
  posted().filter(m=>m.date<=b&&(cumulative||m.date>=a)).forEach(m=>m.lines.forEach(l=>{const r=res[l.account]||(res[l.account]={d:0,c:0});r.d=r2(r.d+(+l.debit||0));r.c=r2(r.c+(+l.credit||0))}));
  return res}
function partnerBal(code){const end=periodRange()[1];const res={};posted().filter(m=>m.date<=end).forEach(m=>m.lines.forEach(l=>{if(l.account!==code||!l.partnerId)return;res[l.partnerId]=r2((res[l.partnerId]||0)+(+l.debit||0)-(+l.credit||0))}));return res}
function nextMoveRef(j,date){DB.counters.move[j]=(DB.counters.move[j]||0)+1;return `${j}/${(date||today()).slice(0,4)}/${String(DB.counters.move[j]).padStart(4,'0')}`}
function addMove(m,post){
  const mv={id:uid('m'),ref:null,journal:'OD',date:today(),partnerId:null,label:'',origin:null,status:'draft',log:[],...m};

const pUntaxed=p=>r2(p.lines.reduce((s,l)=>s+(+l.cost||0),0));
const pVat=p=>r2(p.lines.reduce((s,l)=>s+r2((+l.cost||0)*(+l.vat||0)/100),0));
const pTotal=p=>r2(pUntaxed(p)+pVat(p));

function newPO(extra){DB.counters.purchase++;
  const p={id:uid('po'),ref:DB.settings.purchase.prefix+String(DB.counters.purchase).padStart(4,'0'),supplierId:'',bookingId:'',orderDate:today(),billRef:'',billDate:'',status:'draft',lines:[],payments:[],moveIds:[],notes:'',log:[],...extra};
  DB.purchase.push(p);return p}
/* One draft purchase order per supplier, from booking services that have a supplier and a cost */
function genPOs(b){const groups={};
  b.lines.forEach(l=>{if(l.poId||!l.supplierId||!(+l.cost))return;(groups[l.supplierId]||(groups[l.supplierId]=[])).push(l)});
  return Object.entries(groups).map(([s,ls])=>{
    const p=newPO({supplierId:s,bookingId:b.id,lines:ls.map(l=>({id:uid('pl'),type:l.type,desc:`${b.ref}: ${l.desc}`,cost:+l.cost,vat:+DB.settings.purchase.billVat||0}))});
    ls.forEach(l=>l.poId=p.id);log(p,`Created from booking ${b.ref}.`);return p})}

function postBillMove(p){const by={},lines=[];
  p.lines.forEach(l=>{const a=DB.acc.cost[l.type]||'6044';by[a]=r2((by[a]||0)+(+l.cost||0))});
  Object.entries(by).forEach(([a,v])=>lines.push({account:a,debit:v,partnerId:p.supplierId,label:p.ref}));
  const v=pVat(p);if(v)lines.push({account:'4426',debit:v,partnerId:p.supplierId,label:'VAT '+p.ref});
  lines.push({account:'401',credit:pTotal(p),partnerId:p.supplierId,label:p.billRef||p.ref});
  const m=addMove({journal:'ACH',date:p.billDate,partnerId:p.supplierId,label:`Supplier bill ${p.billRef||p.ref}`,origin:{model:'purchase',id:p.id},lines},true);
  p.moveIds=[m.id];return m}

/* ---------- Expenses ---------- */
const eTotal=e=>r2((+e.amount||0)+r2((+e.amount||0)*(+e.vat||0)/100));
/* Expense: Dr 6xx category account / Dr 4426 VAT / Cr bank, cash or 401 */
function postExpenseMove(e){const cat=find('expCat',e.category);const v=r2((+e.amount||0)*(+e.vat||0)/100);
  const lines=[{account:cat?cat.account:'658',debit:+e.amount,partnerId:e.supplierId||null,label:e.description}];
  if(v)lines.push({account:'4426',debit:v,partnerId:e.supplierId||null,label:'VAT'});
  lines.push(e.paidFrom==='supplier'?{account:'401',credit:eTotal(e),partnerId:e.supplierId||null,label:e.description}:{account:DB.journal.find(j=>j.id===e.paidFrom).account,credit:eTotal(e),partnerId:e.supplierId||null,label:e.description,...fx(e.paidFrom,eTotal(e))});
  const m=addMove({journal:e.paidFrom==='supplier'?'ACH':e.paidFrom,date:e.date,partnerId:e.supplierId||null,label:`Expense: ${e.description}`,origin:{model:'expense',id:e.id},lines},true);
  e.moveId=m.id;return m}

/* ---------- Marketing ---------- */
function audience(c){let list=DB.contact.filter(x=>x.type!=='supplier'&&x.marketing!=='no');
  if(c.audience==='b2c')list=list.filter(x=>x.type==='customer');
  else if(c.audience==='b2b')list=list.filter(x=>x.type==='agency');
  else if(c.audience==='corporate')list=list.filter(x=>x.type==='corporate');
  else if(c.audience==='leads'){const ids=new Set(DB.lead.filter(l=>!['won','lost'].includes(l.stage)).map(l=>l.contactId));list=list.filter(x=>ids.has(x.id))}
  else if(c.audience==='past'){const ids=new Set(DB.booking.filter(b=>!['draft','cancelled'].includes(b.status)).map(b=>b.contactId));list=list.filter(x=>ids.has(x.id))}
  if(c.channel==='email')list=list.filter(x=>x.email);
  if(c.channel==='sms')list=list.filter(x=>x.phone);
  return list}
function campaignError(c){
  if(!c.name)return 'Name the campaign first.';
  if(!(c.body||'').trim())return 'Write the message first.';
  if(c.channel==='email'&&!c.subject)return 'Add a subject line.';
  if(!SOCIAL.includes(c.channel)&&!audience(c).length)return 'Nobody in this audience can receive it. Choose another audience.';
  return ''}
function audienceBlock(c){const l=audience(c);const unsub=DB.contact.filter(x=>x.marketing==='no').length;
  return `<p style="margin:0"><b>${l.length}</b> recipient${l.length===1?'':'s'} with ${c.channel==='sms'?'a phone number':'an email address'}. ${unsub} unsubscribed contact${unsub===1?' is':'s are'} always left out.</p>
   <div class="recips">${l.slice(0,10).map(x=>badge(x.name)).join('')}${l.length>10?badge(`${l.length-10} more`):''}</div>`}
function preview(c){const r=SOCIAL.includes(c.channel)?null:audience(c)[0];const first=r?r.name.split(' ')[0]:'there';
  const raw=(c.body||'').split('{name}').join(first);const body=esc(raw);const m=DB.settings.marketing,co=DB.settings.company;
  if(c.channel==='email')return `<div class="pv-mail"><div class="pv-h"><div><span class="muted">From</span> ${esc(m.senderName)} &lt;${esc(m.senderEmail)}&gt;</div><div><span class="muted">To</span> ${r?esc(r.email):'No recipients'}</div><div><span class="muted">Subject</span> <b>${esc(c.subject||'No subject yet')}</b></div></div><div class="pv-body">${body||'<span class="muted">Write the message to see it here.</span>'}</div><div class="pv-foot">${esc(co.name)}, ${esc(co.address)}. Unsubscribe from these emails.</div></div>`;
  if(c.channel==='sms'){const uni=/[^\x00-\x7F]/.test(raw);const per=uni?70:160;const seg=Math.max(1,Math.ceil(raw.length/per));
    return `<div class="pv-sms"><div class="pv-sender">${esc(m.smsSender)}</div><div class="bubble">${body||'…'}</div><p class="hint">${raw.length} characters, ${seg} SMS segment${seg>1?'s':''} per recipient.${uni?' Arabic or other Unicode text fits 70 characters per segment.':''}</p></div>`}
  return `<div class="pv-post"><div class="pv-acct"><span class="avatar">${esc((co.name||'A').charAt(0))}</span><b>${esc(m[c.channel]||'Account not set')}</b><span class="muted">${label(CHANNELS,c.channel)}</span></div><div class="pv-img">${icon('plane',40)}<span class="muted">Image goes here</span></div><div class="pv-body">${body||'…'}</div></div>`}
function listCampaigns(){

  return table(rows,[
    {label:'Campaign',r:c=>`<strong>${esc(c.name||'Untitled')}</strong>`},{label:'Channel',r:c=>badge(label(CHANNELS,c.channel),SOCIAL.includes(c.channel)?'b-accent':'')},

    {label:'Date',r:c=>c.status==='sent'&&c.stats?fmtDate(c.stats.sentAt):c.scheduledAt?fmtDate(c.scheduledAt):'<span class="muted">Not scheduled</span>'},
    {label:'Status',r:c=>badge(label(CAMP_STATES,c.status),CAMP_BADGE[c.status])},{label:'Recipients',num:1,r:c=>c.stats&&!SOCIAL.includes(c.channel)?c.stats.recipients:''}

/* ---------- Calendar ---------- */
const KIND_LEGEND=[['flight','Flights and trips'],['service','Other services'],['due','Payments due'],['camp','Campaigns'],['task','Your events']];
const fmtDay=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function calEvents(){const ev=[],cs=DB.settings.calendar;
  if(cs.services==='yes')DB.booking.filter(b=>b.status!=='cancelled').forEach(b=>{const who=cname(b.contactId),where=b.destinationName||b.destination||b.ref;
    b.lines.forEach(l=>{if(l.date)ev.push({date:l.date,time:'',title:`${label(SERVICE_TYPES,l.type)}: ${l.desc||'service'}`,sub:`${b.ref}, ${who}`,kind:l.type==='flight'?'flight':'service',mod:'bookings',id:b.id})});
    if(b.tripType!=='service'&&b.departDate&&!b.lines.some(l=>l.date===b.departDate))ev.push({date:b.departDate,time:'',title:`Departure to ${where}`,sub:`${b.ref}, ${who}`,kind:'flight',mod:'bookings',id:b.id});
    if(b.tripType==='return'&&b.returnDate)ev.push({date:b.returnDate,time:'',title:`Return from ${where}`,sub:`${b.ref}, ${who}`,kind:'flight',mod:'bookings',id:b.id})});
  if(cs.due==='yes')DB.invoice.filter(i=>i.status==='posted').forEach(i=>ev.push({date:i.dueDate,time:'',title:`Payment due, ${i.number}`,sub:`${cname(i.contactId)}, ${money(iBalance(i))} to collect`,kind:'due',mod:'invoicing',id:i.id}));
  if(cs.campaigns==='yes')DB.campaign.filter(c=>c.status==='scheduled'&&c.scheduledAt).forEach(c=>ev.push({date:c.scheduledAt,time:'',title:`Send campaign: ${c.name}`,sub:label(CHANNELS,c.channel),kind:'camp',mod:'marketing',id:c.id}));
  DB.event.forEach(e=>ev.push({date:e.date,time:e.time||'',title:e.title||'Untitled event',sub:[label(EVENT_KINDS,e.kind),e.contactId?cname(e.contactId):'',e.bookingId?recName('booking',e.bookingId):''].filter(Boolean).join(', '),kind:e.status==='done'?'done':'task',mod:'calendar',id:e.id}));
  return ev.filter(e=>e.date).sort((a,b)=>(a.date+(a.time||'00:00')).localeCompare(b.date+(b.time||'00:00')))}
const agItem=e=>`<li><button class="ag" data-act="calopen" data-mod="${e.mod}" data-id="${e.id}"><i class="dot k-${e.kind}" aria-hidden="true"></i><span class="ag-time">${e.time||'All day'}</span><span><b class="${e.kind==='done'?'strike':''}">${esc(e.title)}</b><span class="muted ag-sub">${esc(e.sub)}</span></span></button></li>`;
function calendarView(){
  if(!S.calMonth){S.calMonth=today().slice(0,7);S.calDay=today()}
  const ev=calEvents();
  const tools=`<div class="chips">${[['month','Month'],['agenda','Agenda']].map(([k,l])=>`<button class="chip ${S.calView===k?'on':''}" data-act="calview" data-v="${k}">${l}</button>`).join('')}</div><div class="legend">${KIND_LEGEND.map(([k,l])=>`<span><i class="dot k-${k}" aria-hidden="true"></i>${l}</span>`).join('')}</div>`;
  let body;
  if(S.calView==='agenda'){const from=today(),to=addDays(from,60);const up=ev.filter(e=>e.date>=from&&e.date<=to);const days=[...new Set(up.map(e=>e.date))];
    body=`<section class="sheet"><h2>Next 60 days</h2>${days.length?days.map(d=>`<h3 class="agdate">${fmtDay(d)}</h3><ul class="agenda">${up.filter(e=>e.date===d).map(agItem).join('')}</ul>`).join(''):'<p class="muted" style="margin:0">Nothing scheduled in the next 60 days.</p>'}</section>`;
  }else{
    const [y,mo]=S.calMonth.split('-').map(Number);const first=new Date(Date.UTC(y,mo-1,1));const offset=(first.getUTCDay()+6)%7;
    const days=new Date(Date.UTC(y,mo,0)).getUTCDate();const cells=Math.ceil((offset+days)/7)*7;
    const title=first.toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
    let grid=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
    for(let i=0;i<cells;i++){const dt=new Date(Date.UTC(y,mo-1,1+i-offset));const ds=dt.toISOString().slice(0,10);const de=ev.filter(e=>e.date===ds);
      grid+=`<div class="cal-day ${dt.getUTCMonth()===mo-1?'':'out'} ${ds===today()?'today':''} ${ds===S.calDay?'sel':''}"><button class="cal-num" data-act="calday" data-v="${ds}" aria-label="${fmtDay(ds)}, ${de.length} item${de.length===1?'':'s'}">${dt.getUTCDate()}</button>
       ${de.slice(0,3).map(e=>`<button class="ev k-${e.kind}" data-act="calopen" data-mod="${e.mod}" data-id="${e.id}" title="${esc(e.title)}">${e.time?`<span>${e.time}</span> `:''}${esc(e.title)}</button>`).join('')}
       ${de.length>3?`<button class="cal-more" data-act="calday" data-v="${ds}">${de.length-3} more</button>`:''}</div>`}
    const dayEv=ev.filter(e=>e.date===S.calDay);
    body=`<div class="calnav">${btn('‹','calnav','','data-v="-1" aria-label="Previous month"')}${btn('Today','calnav','','data-v="0"')}${btn('›','calnav','','data-v="1" aria-label="Next month"')}<h2>${title}</h2></div>
     <div class="cal">${grid}</div>
     <section class="sheet"><h2>${fmtDay(S.calDay)}</h2>${dayEv.length?`<ul class="agenda">${dayEv.map(agItem).join('')}</ul>`:'<p class="muted" style="margin:0">Nothing on this day. Use New event to add a follow-up.</p>'}</section>`;
  }
  return cp(crumbs('Calendar'),btn('New event','new','primary'),tools)+body;
}

function bookFromRequest(r){const tt=['visa','insurance'].includes(r.type)?'service':(r.dateTo?'return':'oneway');const rate=DB.pricing[channelOf(r.agencyId)];const price=r.quote?+r.quote.amount:0;
  const b=newBooking(r.agencyId,{tripType:tt,destinationName:r.destination,departDate:tt==='service'?'':r.dateFrom,returnDate:tt==='return'?r.dateTo:'',travellers:r.travellers||'',

  log(b,`Created from portal request ${r.ref}.`);r.status='booked';r.bookingId=b.id;reqMsg(r,'system',`Booking ${b.ref} created. Follow it under Bookings; the confirmation appears there once it’s confirmed.`);log(r,`Booking ${b.ref} created.`);syncLead(r);return b}

function roleSummary(r){const p=r.perms;const pages=MODULES.filter(m=>(m.agentOnly===r.audience||m.agentOnly==='both')&&(!m.can||m.can(p))).map(m=>m.name);const notes=[];
  if(r.audience==='customer'){
    if(p.acceptQuotes==='yes')notes.push(p.approveQuotes==='yes'?'Accepts any quote and approves colleagues’ quotes.':+p.approvalLimit>0?`Accepts quotes up to ${money(p.approvalLimit)}; above that an approver must approve.`:'Accepts quotes of any amount.');
    else if(p.requests!=='none')notes.push('Can’t accept quotes.');
    if(p.scope==='own'&&p.requests!=='none')notes.push('Sees only requests they created and the bookings that came from them.');
    if(p.bookings==='travelling')notes.push('Sees only trips where they are one of the travellers.');
    if(p.bookings!=='none')notes.push(p.bookings==='travelling'?'Sees and downloads the tickets, vouchers and e-visas issued in their own name.':'Sees and downloads every ticket, voucher and e-visa on the bookings they can see.');

function stageFromCRM(l,st){const r=find('request',l.requestId);if(!r){l.stage=st;return}
  if(REQ_TO_STAGE[r.status]===st)return;
  if(r.status==='booked'){const b=find('booking',r.bookingId);return toast(`This deal already has booking ${b?b.ref:''}. Cancel the booking first if the deal is off.`,'err')}
  const closed=['declined','cancelled'].includes(r.status);
  if(st==='new'){r.status='submitted';reqMsg(r,'system',closed?'Request reopened by our team.':'Request moved back to submitted.');log(r,'Moved to New from the CRM.');toast(`${r.ref} is back to Submitted.`)}
  else if(st==='qualified'){r.status='review';reqMsg(r,'system',closed?'Request reopened. Our team is reviewing it.':'Our team is reviewing your request.');log(r,'Review started from the CRM.');toast(`${r.ref} is now In review. The customer sees this in the portal.`)}
  else if(st==='quoted'){if(r.quote&&!closed&&r.quote.validUntil>=today()){r.status='quoted';reqMsg(r,'system',`Quote sent: ${money(r.quote.amount)}, valid until ${fmtDate(r.quote.validUntil)}.`);log(r,'Quote sent again from the CRM.');toast('The existing quote was sent to the customer again.')}
    else{S.reqCtx=r.id;ACTIONS.reqquote();return}}
  else if(st==='won'){if(r.status!=='accepted'){r.status='accepted';reqMsg(r,'system','Confirmed by our team.')}log(r,'Marked won in the CRM.');const b=bookFromRequest(r);toast(`Won. Booking ${b.ref} created as a draft, and the customer can follow it in the portal.`)}
  else if(st==='lost'){S.reqCtx=r.id;ACTIONS.reqdecline();return}
  syncLead(r)}

     <p class="hint">The agency sees this in the portal and gets an email. Their B2B markup is ${DB.pricing.B2B}%, so price from your supplier costs plus that markup.</p>
     <div class="dlg-actions">${btn('Cancel','closemodal')}${btn('Send quote','reqquotesend','primary')}</div>`,'','Send a quote')},
  reqquotesend(){const r=reqCtx();const amt=r2(parseFloat($('#q-amt').value)),until=$('#q-until').value,notes=$('#q-notes').value.trim();
    if(!(amt>0))return toast('Enter the price.','err');if(!until||until<today())return toast('Set a validity date from today onwards.','err');
    r.quote={amount:amt,validUntil:until,notes,sentAt:today()};r.status='quoted';reqMsg(r,'system',`Quote sent: ${money(amt)}, valid until ${fmtDate(until)}.`);log(r,`Quote of ${money(amt)} sent. Email notification simulated.`);
    S.reqCtx=null;closeModal();toast('Quote sent to the customer.');render()},
  qaccept(){const r=cur();const p=P();if(p.acceptQuotes!=='yes')return toast('Your role can’t accept quotes.','err');
    if(p.approveQuotes!=='yes'&&+p.approvalLimit>0&&+r.quote.amount>+p.approvalLimit){r.status='approval';r.approvalBy=puser().name;reqMsg(r,'system',`Quote accepted by ${puser().name}. Waiting for approval because it’s above their ${money(p.approvalLimit)} limit.`);log(r,'Quote sent for approval on the customer side.');toast('Sent to an approver on your account.');return render()}
    acceptQuote(r,(puser()||{}).name||'the customer');render()},
  qdecline(){const r=cur();r.status='review';reqMsg(r,'system',`Quote declined by ${(puser()||{}).name||'the agency'}. Tell us what to change in a message.`);log(r,'Quote declined by the agency.');toast('Quote declined. Send a message to say what to change.');render()},
  reqcancel(){const r=cur();r.status='cancelled';reqMsg(r,'system','Request cancelled by the agency.');log(r,'Cancelled by the agency.');toast('Request cancelled.');render()},
  reqdecline(t){if(t)S.reqCtx=null;openModal(`<h2>Decline ${esc(reqCtx().ref)}</h2><div class="grid one"><label class="fld" for="dc-why"><span>Reason, shown to the agency</span><textarea id="dc-why" rows="4" placeholder="For example, no availability on these dates"></textarea></label></div>
    <div class="dlg-actions">${btn('Cancel','closemodal')}${btn('Decline request','reqdeclinesend','primary')}</div>`,'','Decline request')},
  reqdeclinesend(){const r=reqCtx();const why=$('#dc-why').value.trim();if(!why)return toast('Give the agency a reason.','err');r.status='declined';reqMsg(r,'staff',why);reqMsg(r,'system','Request declined.');log(r,'Declined.');S.reqCtx=null;closeModal();render()},
  reqbook(){const r=cur();const b=bookFromRequest(r);toast(`Booking ${b.ref} created as a draft. Add suppliers and confirm it.`);go('bookings',b.id)},
  invtab(t){S.invTab=t.dataset.v;S.search='';S.filter='all';render()},
  purtab(t){S.purTab=t.dataset.v;S.search='';S.filter='all';render()},
  rcptpick(t){const i=find('invoice',t.dataset.v);if(i.payments.length===1)return openDoc('receipt',i.id,i.payments[0].id);pickPaymentDialog('receipt',i.id,i.payments)},
  vchpick(t){const p=find('purchase',t.dataset.v);if(p.payments.length===1)return openDoc('voucher',p.id,p.payments[0].id);pickPaymentDialog('voucher',p.id,p.payments)},
  ackpo(){const p=cur();p.ack=today();log(p,`Acknowledged by ${(puser()||{}).name||'the supplier'} in the supplier portal.`);toast('Order acknowledged. Thank you.');render()},
  qapprove(){const r=cur();if(P().approveQuotes!=='yes')return toast('Your role can’t approve quotes.','err');acceptQuote(r,`${puser().name}, approving ${r.approvalBy||'a colleague'}`);render()},
  qreject(){const r=cur();if(P().approveQuotes!=='yes')return toast('Your role can’t approve quotes.','err');r.status='review';reqMsg(r,'system',`Not approved by ${puser().name}. Tell us what to change in a message.`);log(r,'Approval refused by the customer.');toast('Not approved. The request is back with our team.');render()},
  roleedit(t){S.roleSel=S.roleSel===t.dataset.v?null:t.dataset.v;render()},
  rolenew(t){const aud=t.dataset.v;const base=roleOf(aud==='customer'?'r-viewer':'s-res');const r={id:uid('role'),name:'New role',audience:aud,builtin:false,desc:'',perms:{...base.perms}};DB.portalRoles.push(r);S.roleSel=r.id;render();const n=$('#role-name');if(n){n.focus();n.select()}},
  roledup(t){const s=roleOf(t.dataset.v);const r={id:uid('role'),name:`${s.name} (copy)`,audience:s.audience,builtin:false,desc:s.desc,perms:{...s.perms}};DB.portalRoles.push(r);S.roleSel=r.id;toast(`${r.name} created. Change what you need.`);render()},
  roledel(t){const r=roleOf(t.dataset.v);const n=DB.portalUsers.filter(u=>u.role===r.id).length;if(n)return toast(`${n} user${n>1?'s use':' uses'} this role. Give them another role first.`,'err');
    DB.portalRoles=DB.portalRoles.filter(x=>x.id!==r.id);S.roleSel=null;toast(`${r.name} deleted.`);render()},
  themepreset(t){const [,a,b]=THEME_PRESETS[+t.dataset.v];DB.settings.theme.accent=a;DB.settings.theme.bar=b;applyTheme();toast(`${THEME_PRESETS[+t.dataset.v][0]} colours applied.`);render()},
  uplogo(){const f=$('#logo-file').files[0];if(!f)return toast('Choose an image first.','err');if(!/^image\/(png|jpeg|svg\+xml|webp)$/.test(f.type))return toast('Use a PNG, JPG, SVG or WebP image.','err');
    if(f.size>1048576)return toast('The logo is over 1 MB. Use a smaller file.','err');const r=new FileReader();r.onload=()=>{DB.settings.theme.logo=r.result;toast('Logo updated.');render()};r.readAsDataURL(f)},
  rmlogo(){DB.settings.theme.logo='';toast('Logo removed.');render()},
  themereset(){const logo=DB.settings.theme.logo;DB.settings.theme={...THEME_DEFAULT,logo};applyTheme();toast('Appearance reset to default. Your logo was kept.');render()}
};





/* ---------- Events ---------- */
document.addEventListener('click',e=>{if(e.target.dataset&&e.target.dataset.overlay)return closeModal();const t=e.target.closest('[data-act]');if(!t)return;const fn=ACTIONS[t.dataset.act];if(fn)fn(t)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-act],article[data-act]'))e.target.click()});
document.addEventListener('keydown',e=>{
  const inp=e.target.closest&&e.target.closest('.cb-input');
  if(!inp){if(e.key==='Escape'&&$('#modal').innerHTML)closeModal();return}
  const cb=inp.closest('.cb');const ul=cb.querySelector('.cb-list');
  if(ul.hidden&&(e.key==='ArrowDown'||e.key==='Enter')){e.preventDefault();cbOpen(cb);return}
  const items=[...ul.querySelectorAll('[data-cbpick],[data-cbcreate]')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;cb._idx=((cb._idx??-1)+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
    items.forEach((li,i)=>li.classList.toggle('act',i===cb._idx));inp.setAttribute('aria-activedescendant',items[cb._idx].id);items[cb._idx].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();const li=items[cb._idx>=0?cb._idx:0];if(!li)return;if(li.dataset.cbcreate)cbCreate(cb);else cbSet(cb.dataset.model,cb.dataset.id,cb.dataset.cbfield,li.dataset.cbpick)}
  else if(e.key==='Escape'){cbClose(cb,true)}
});
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('cb-input'))cbOpen(e.target.closest('.cb'))});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('cb-input'))cbOpen(e.target.closest('.cb'))});
document.addEventListener('focusout',e=>{const cb=e.target.closest&&e.target.closest('.cb');if(cb)setTimeout(()=>{if(document.body.contains(cb)&&!cb.contains(document.activeElement))cbClose(cb,true)},120)});
document.addEventListener('mousedown',e=>{const li=e.target.closest&&e.target.closest('[data-cbpick],[data-cbcreate]');if(!li)return;e.preventDefault();const cb=li.closest('.cb');
  if(li.dataset.cbcreate)cbCreate(cb);else cbSet(cb.dataset.model,cb.dataset.id,cb.dataset.cbfield,li.dataset.cbpick)});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.search=e.target.value;const v=$('#view');if(v)v.innerHTML=LISTS[S.mod]()}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='role'){if(el.value==='admin'){S.role='admin';S.puser=null}else{const u=DB.portalUsers.find(x=>x.id===el.value);S.role=u.agencyId;S.puser=u.id;u.lastLogin=today()}go(isAgent()?portalHome():null);toast(isAgent()?`Signed in to the portal as ${puser().name}, ${cname(S.role)}.`:'Back in the ERP as administrator.');return}
  if(el.dataset.pricing){DB.pricing[el.dataset.pricing]=parseFloat(el.value)||0;toast(`${el.dataset.pricing} markup set to ${DB.pricing[el.dataset.pricing]}%.`);$('#view').innerHTML=listProducts();return}
  if(el.id==='catalog'&&el.value){const b=cur(),p=find('product',el.value);b.lines.push({id:uid('x'),type:p.type,desc:p.name,date:b.departDate||'',dateTo:['hotel','package'].includes(p.type)?(b.returnDate||''):'',supplierId:p.supplierId,cost:p.cost,markup:DB.pricing[channelOf(b.contactId)]});render();return}
  if(el.dataset.urole){const u=DB.portalUsers.find(x=>x.id===el.dataset.urole);u.role=el.value;log(find('contact',u.agencyId),`${u.name} is now ${(roleOf(u.role)||{}).name}.`);toast(`${u.name} is now ${(roleOf(u.role)||{}).name}.`);render();return}
  if(el.dataset.perm){const r=roleOf(S.roleSel);if(!r||r.builtin)return;r.perms[el.dataset.perm]=el.type==='number'?(parseFloat(el.value)||0):el.value;const sm=$('#rolesum');if(sm)sm.innerHTML=roleSummary(r);toast('Role updated.');return}
  if(el.dataset.rolef){const r=roleOf(S.roleSel);if(!r||r.builtin)return;const v=el.value.trim();if(el.dataset.rolef==='name'&&!v)return toast('Give the role a name.','err');r[el.dataset.rolef]=v;toast('Role updated.');render();return}
  if(el.dataset.docshare){const d=cur().docs.find(x=>x.id===el.dataset.docshare);d.shared=el.checked?'yes':'no';toast(el.checked?`${d.name} is visible in the portal.`:`${d.name} is now internal only.`);return}
  if(el.id==='doc-prices'){openDoc(S.doc.kind,S.doc.id,S.doc.pid,{prices:el.checked});return}
  if(el.id==='nb-type'){$('#nb-code').value=nextCode(el.value);$('#nb-jid').value=nextJournal(el.value);return}
  if(el.dataset.cur){const v=parseFloat(el.value);if(v>0){setRate(el.dataset.cur,v);toast(`Rate saved: 1 USD = ${fmtCur(v,el.dataset.cur)}.`)}return}
  if(el.dataset.setting){setPath(el.dataset.setting,el.dataset.stype==='number'?(parseFloat(el.value)||0):el.value);toast('Setting saved.');if(el.dataset.setting.startsWith('settings.docs.'))refreshTplPrev();if(el.dataset.setting.startsWith('settings.theme.')){applyTheme();render()}if(el.dataset.setting==='settings.company.name')render();return}
  if(el.dataset.stagelbl){const v=el.value.trim();if(v){LEAD_STAGES[+el.dataset.stagelbl][1]=v;toast('Stage renamed.')}return}
  if(el.dataset.expcat){const c=find('expCat',el.dataset.expcat);if(c){c[el.dataset.ek]=el.value;toast('Category updated.')}return}
  if(el.id==='period'){S.period=el.value;render();return}
  if(el.id==='acc-rate'){const v=parseFloat(el.value);if(v>0){setRate('LBP',v);toast(`Rate set to ${fmtLBP.format(v)} LBP per USD.`)}return}
  if(el.dataset.accmap){const k=el.dataset.accmap;DB.acc[k][el.dataset.type]=k==='vat'?+el.value:el.value;toast('Default updated. It applies to new invoices.');return}
  if(el.dataset.line){const rec=find(el.dataset.model,el.dataset.id);const l=rec.lines.find(x=>x.id===el.dataset.line);const k=el.dataset.lfield;
    l[k]=['cost','markup','amount','debit','credit','vat'].includes(k)?(parseFloat(el.value)||0):el.value;
    if(k==='type'){if(el.dataset.model==='invoice')l.vat=DB.acc.vat[l.type]||0;render()}else refreshLive();return}
  if(el.dataset.field){const m=el.dataset.model,rec=find(m,el.dataset.id),f=MODELS[m].fields[el.dataset.field];let v=el.value;if(m==='lead'&&el.dataset.field==='stage'&&rec.requestId){stageFromCRM(rec,v);render();return}
    if(f.type==='check')v=el.checked?'yes':'no';if(f.type==='money'||f.type==='number')v=parseFloat(v)||0;if(f.upper)v=v.toUpperCase().trim();
    const old=rec[el.dataset.field];rec[el.dataset.field]=v;
    if(f.onChange&&old!==v)f.onChange(rec);
    if(f.track&&old!==v){let shown=v;if(f.type==='select')shown=label(optsOf(f),v);if(f.type==='m2o')shown=cname(v);if(f.type==='money')shown=money(v);log(rec,`${f.label} changed to ${shown}.`)}
    if(el.hasAttribute('data-rerender'))render();else refreshLive()}
});
/* Kanban drag and drop */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.kcard');if(c)e.dataTransfer.setData('text/plain',c.dataset.id)});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(col){e.preventDefault();col.classList.add('drop')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drop')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(!col)return;e.preventDefault();
  const l=find('lead',e.dataTransfer.getData('text/plain'));const st=col.dataset.stage;
  if(l&&l.requestId&&l.stage!==st){stageFromCRM(l,st)}else if(l&&l.stage!==st){l.stage=st;log(l,`Stage changed to ${label(LEAD_STAGES,st)}.`);toast(`Moved to ${label(LEAD_STAGES,st)}.`)}render()});

window.addEventListener('beforeprint',()=>{if($('#modal .paper'))document.body.classList.add('printing')});
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));
bootAll();
render();
</script>
